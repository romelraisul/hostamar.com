# nginx-rtmp config for Hostamar TV
# RTMP ingest on :1935, HLS output for the /tv web player.
# HLS is served on :8080 with CORS for Vercel-hosted /tv page.

worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            allow publish all;
            allow play all;

            # HLS for the web player
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_nested on;
            dash on;
            dash_path /tmp/dash;
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 8080;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
        }

        location /dash {
            root /tmp;
            add_header Cache-Control no-cache;
        }

        # Direct MP4 delivery for /tv/watch/{slug} SEO pages + VideoObject contentUrl.
        # The container mounts the host videos dir at /videos.
        location /videos/ {
            alias /videos/;
            types { video/mp4 mp4; }
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin * always;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location / {
            return 200 'Hostamar TV RTMP+HLS OK';
            add_header Content-Type text/plain;
        }
    }
}
