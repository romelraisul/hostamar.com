# ═══════════════════════════════════════════════════════════════
# Hostamar 24/7 AI TV Station
# nginx-rtmp ingest + FFmpeg multi-destination auto-streamer
#
# Usage on Windows PC (RTX 5060):
#   cd docker/tv-station
#   docker compose up -d
#   # Then run agent: cd scripts/tv-agent && npm install && npm start
#   # Or manual: ffmpeg -re -stream_loop -1 -f concat -safe 0 -i ./videos/playlist.txt -c:v libx264 -preset veryfast -b:v 2500k -c:a aac -f flv rtmp://localhost:1935/live/tv
#
# HLS playback: http://localhost:8080/hls/live/tv/index.m3u8 (VLC)
# Public HLS via Cloudflare Tunnel: set TV_HLS_URL to https://<tunnel>.cfargotunnel.com/hls/live/tv/index.m3u8
# ═══════════════════════════════════════════════════════════════

services:
  rtmp:
    image: alfg/nginx-rtmp:latest
    container_name: hostamar-tv-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest: rtmp://localhost:1935/live/tv
      - "8080:8080"   # HLS playback: http://localhost:8080/hls/live/tv/index.m3u8
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./videos:/videos:ro
      - hls-data:/tmp/hls
      - dash-data:/tmp/dash
    networks:
      - tv

  streamer:
    image: linuxserver/ffmpeg:latest
    container_name: hostamar-tv-streamer
    restart: unless-stopped
    depends_on:
      - rtmp
    environment:
      - HOSTAMAR_API=${HOSTAMAR_API:-https://hostamar.com}
      - TV_AGENT_SECRET=${TV_AGENT_SECRET:-}
      - POLL_SECONDS=${POLL_SECONDS:-10}
      - LOCAL_RTMP=rtmp://rtmp:1935/live/tv
    volumes:
      - ./streamer.sh:/streamer.sh:ro
      - ./videos:/videos:ro
      - hls-data:/tmp/hls
    entrypoint: ["/bin/sh", "/streamer.sh"]
    networks:
      - tv

volumes:
  hls-data:
  dash-data:

networks:
  tv:
    driver: bridge
