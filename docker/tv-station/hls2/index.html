<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostamar TV — LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  body{margin:0;background:#09090b;color:#fafafa;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{width:100%;padding:12px 20px;display:flex;align-items:center;gap:10px;box-sizing:border-box}
  .logo{font-weight:800;font-size:20px;color:#34d399}
  .badge{background:#dc2626;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;animation:pulse 1.5s infinite}
  @keyframes pulse{50%{opacity:.55}}
  #v{width:min(96vw,960px);aspect-ratio:16/9;background:#000;border-radius:14px;border:1px solid #27272a}
  #msg{color:#a1a1aa;font-size:13px;margin-top:10px;text-align:center;padding:0 16px}
</style></head><body>
<header><span class="logo">Hostamar TV</span><span class="badge">● LIVE</span>
<span style="color:#71717a;font-size:12px;margin-left:auto">বাংলা সম্প্রচার</span></header>
<video id="v" autoplay muted playsinline controls></video>
<div id="msg">Connecting to live stream…</div>
<script>
const v = document.getElementById("v");
const msg = document.getElementById("msg");
function ok(){ msg.textContent = "● Live — Hostamar TV (VP9)"; }
function start(){
  if (window.Hls && Hls.isSupported()){
    const hls = new Hls({ lowLatencyMode:false });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) msg.textContent = "Stream error: " + d.details + " — retrying…"; });
    hls.loadSource("master.m3u8");
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(()=>{}); ok(); });
  } else { v.src = "master.m3u8"; v.play().catch(()=>{}); ok(); }
}
start();
v.addEventListener("error", () => { msg.textContent = "Reconnecting…"; setTimeout(start, 3000); });
</script></body></html>
