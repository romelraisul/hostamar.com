name: Model Catalog Self-Heal

on:
  workflow_dispatch: {}
  schedule:
    # Weekly B2 + catalog verify (Mon 03:00 UTC). Deliberately weekly, NOT hourly —
    # the old hourly schedule burned 100 Vercel deploys/day and was disabled 2026-09-27.
    - cron: '0 3 * * 1'
  #   schedule:
  #     - cron: '0 * * * *' # hourly

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write .env from secrets
        run: |
          cat > .env <<ENVFILE
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          KILOCODE_API_KEY=${{ secrets.KILO_API_KEY }}
          OPENCODE_ZEN_API_KEY=${{ secrets.OPENCODE_ZEN_API_KEY }}
          ENVFILE

      - name: Regenerate catalog from live upstreams
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: node scripts/gen-model-catalog.mjs

      - name: Fix context lengths from live docs
        run: node scripts/gen-context-table.mjs

      - name: Pong-test flagship free models
        if: env.OPENCODE_ZEN_API_KEY != ''
        run: |
          cat > /tmp/pong.mjs <<'PONG'
          const key = process.env.OPENCODE_ZEN_API_KEY
          for (const model of ['opencode/x-preview-f-free', 'opencode/hy3-free']) {
            try {
              const r = await fetch('https://opencode.ai/zen/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
                body: JSON.stringify({ model, messages: [{ role: 'user', content: 'say pong' }], max_tokens: 5 }),
                signal: AbortSignal.timeout(15000),
              })
              const d = await r.json().catch(() => ({}))
              const reply = d?.choices?.[0]?.message?.content || ''
              console.log(`${model}: ${r.ok && reply ? 'PONG ✓' : `FAIL (${r.status})`}`)
            } catch (e) { console.log(`${model}: FAIL (${e.message})`) }
          }
          PONG
          OPENCODE_ZEN_API_KEY="$OPENCODE_ZEN_API_KEY" node /tmp/pong.mjs

      - name: Sync catalog to Cloudflare KV (Tier-1 no-card R2 replacement)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NS=7ce14c69f70d48449dd50edd4be3dca3
          npx wrangler kv key put MODEL_CATALOG --namespace-id=$NS --path=./MODEL_CATALOG.json --remote
          npx wrangler kv key put ROUTE_MAP --namespace-id=$NS --path=./ROUTE_MAP.json --remote
          npx wrangler kv key put 124_MODELS --namespace-id=$NS --path=./docs/124_MODELS.md --remote

      - name: Verify B2 ISR cache (fails the job if fewer than 462 entries)
        env:
          # GH secret names: B2_KEY_ID = B2 account id, B2_APP_KEY = application key.
          B2_ACCOUNT_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: node scripts/populate-b2.mjs --verify 462

      - name: Commit + push regenerated catalog
        run: |
          git config user.name "model-heal-bot"
          git config user.email "bot@hostamar.com"
          git add lib/gateway/model-catalog.generated.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: model catalog self-heal $(date -u +%FT%TZ)"
            git push
          else
            echo "no changes"
          fi
