name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Cloudflare Pages Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build for Cloudflare Pages (OpenNext)
        run: npm run build:cloudflare:opennext
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SKIP_DB_MIGRATE: '1'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          # Dummy values for AI status endpoint during build
          AI_GATEWAY_URL: 'https://ai.hostamar.com'
          COMFYUI_PUBLIC_URL: 'https://comfy.hostamar.com'
          KILOCODE_API_KEY: 'dummy'
          NVIDIA_API_KEY: 'dummy'
          TOKENROUTER_API_KEY: 'dummy'
          OPENCODE_ZEN_API_KEY: 'dummy'