name: DB Mirror (Turso -> Supabase -> Neon)
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Row-sync Turso -> Supabase
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then echo "SUPABASE_DATABASE_URL secret missing — skipping (mirror disabled)"; exit 0; fi
          npx tsx scripts/sync-db.ts --check
      - name: Sync Supabase -> Neon
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ] || [ -z "$NEON_DATABASE_URL" ]; then echo "secrets missing — skipping sync"; exit 0; fi
          npx tsx scripts/sync-db.ts --supabase-to-neon
