name: DB Mirror (Turso -> Supabase -> Neon)
on:
  schedule:
    - cron: "0 */6 * * *" # ponytail: */15 would burn Neon's free compute quota (that freeze happened before)
  workflow_dispatch: {}

jobs:
  mirror:
    # Guard lives in the step shell: `secrets` is not a valid context in
    # job-level `if:` (GitHub 422s the whole workflow on it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Row-sync Turso -> Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret missing — skipping (mirror disabled)"; exit 0; fi
          npx tsx scripts/sync-db.ts --check
      - name: pg_dump Supabase -> Neon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$NEON_URL" ]; then echo "secrets missing — skipping pg_dump"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump "$SUPABASE_URL" --no-owner --no-acl > backup.sql
          echo "backup.sql: $(wc -l < backup.sql) lines"
          if psql "$NEON_URL" -v ON_ERROR_STOP=0 -q -f backup.sql > psql.log 2>&1; then :; fi
          if grep -qi "error" psql.log; then
            echo "::warning::Neon restore errors (first 3):"; grep -i error psql.log | head -3
          fi
          n=$(psql "$NEON_URL" -t -c "SELECT count(*) FROM \"Customer\"" 2>/dev/null | tr -d '[:space:]')
          echo "Neon Customer rows after restore: ${n:-unreachable}"
          if [ -n "$n" ] && [ "$n" != "0" ]; then
            echo "Mirror complete: Supabase -> Neon"
          else
            # Expected while Neon role lacks schema rights / DB archived (quota reset 2026-11-01).
            echo "::warning::Neon mirror did not land — backup.sql kept as artifact."
          fi
      - name: Keep last dump as artifact (90d)
        if: hashFiles('backup.sql') != ''  # ponytail: cheap presence check
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 90
