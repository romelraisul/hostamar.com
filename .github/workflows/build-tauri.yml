name: Build Hostamar Node installers
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libsoup-3.0-dev libsoup2.4-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev
          for f in /usr/lib/pkgconfig/javascriptcoregtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.1.pc; do
            if [ -f "$f" ]; then sudo cp "$f" "$(dirname "$f")/javascriptcoregtk-4.0.pc" && echo "jsc compat $f -> 4.0"; fi
          done
          for f in /usr/lib/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc; do
            if [ -f "$f" ]; then sudo cp "$f" "$(dirname "$f")/webkit2gtk-4.0.pc" && echo "webkit compat $f -> 4.0"; fi
          done
          for lib in webkit2gtk javascriptcoregtk; do
            for d in /usr/lib/x86_64-linux-gnu /usr/lib; do
              for src in "$d"/lib${lib}-4.1.so*; do
                [ -f "$src" ] || continue
                dst=${src/-4.1/-4.0}
                if [ ! -e "$dst" ]; then sudo ln -sf "$src" "$dst" && echo "so $dst -> $src"; fi
              done
            done
          done
          sudo ldconfig
      - run: npm ci --prefix apps/desktop || npm install --prefix apps/desktop
      - run: npm run tauri build --prefix apps/desktop
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'ubuntu-latest'
        with:
          name: hostamar-node-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-latest'
        with:
          name: hostamar-node-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-latest'
        with:
          name: hostamar-node-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix apps/mobile 2>/dev/null || true
      - run: npx --prefix apps/mobile expo prebuild --clean 2>/dev/null || echo "expo prebuild skip"
      - run: echo "mobile EAS build ready"

  release:
    needs: tauri
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Display structure
        run: ls -R dist || echo "no artifacts"
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
