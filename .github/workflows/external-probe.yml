name: External Probe — hostamar.com health (off-box)

# Runs on GitHub's runners, deliberately NOT on the home box.
#
# ops/monitoring/radar.sh executes inside WSL, so it cannot report the box being
# off, the tunnel being down, or WSL failing to come back after a Windows restart:
# every green radar pass is evidence about this box only. GitHub's infrastructure is
# outside that blast radius, so this workflow is the check that still fires when the
# box is asleep. It probes the *dynamic* /api/health route (the landing page is
# edge-cached and keeps serving 200 from cache while the origin is dead).
#
# Two things this workflow learned the hard way (2026-10-10, run 38009649121):
#   1. From a datacenter IP the public hostname answers with Cloudflare's managed
#      challenge ("Just a moment...", HTTP 403), not with health JSON, so a naive
#      probe reports a false DOWN. The probe detects the challenge and falls back to
#      the Worker's own hostname (hostamar-pages.<sub>.workers.dev), which is not
#      behind the zone's bot rules. UP:edge_challenged therefore means "site is up,
#      this runner's IP is being challenged"; only a real outage (fallback dead too)
#      is reported as DOWN.
#   2. Issues are disabled in this repo, so alerts are: this run going red (GitHub
#      mails whoever last modified this file on scheduled failures) plus the
#      SLACK_WEBHOOK_URL secret when set (verified live: slack_http=200).
#
# Known limits, stated so nobody rediscovers them:
#   - GitHub's cron floor is 5 min and scheduled runs are queued, not exact
#     (expect 10-30 min drift under load).
#   - Scheduled workflows stop after 60 days with no repo activity.
#   - A dedicated monitor (UptimeRobot/BetterStack) pointed at the public URL will hit
#     the same challenge; it needs a zone-side exception for /api/health first.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Force a DOWN verdict to prove the alert path end-to-end'
        type: boolean
        default: false
      debug_paths:
        description: 'Diagnostics: comma-separated paths to print for both hosts (no alert)'
        type: string
        required: false
        default: ''

concurrency:
  group: external-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      URL: https://hostamar.com/api/health
      FALLBACK_URL: https://hostamar-pages.romelraisul.workers.dev/api/health
    steps:
      - name: Probe (public URL, then workers.dev fallback when challenged)
        id: probe
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'

          fetch() { # fetch <url> [ua]; writes /tmp/body, echoes "<code> <challenge?>"
            local code chal="no"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -m 20 -A "$2" \
                   -H 'Accept: application/json, text/plain, */*' "$1" 2>/dev/null || echo 000)
            grep -qiE 'just a moment|cf-mitigated|challenge-platform|_cf_chl' /tmp/body 2>/dev/null && chal="yes"
            echo "$code $chal"
          }

          healthy() { # reads /tmp/body, echoes "<yes|no> <db_down|->"
            grep -q '"healthy"' /tmp/body 2>/dev/null || { echo "no -"; return; }
            grep -q '"connected":false' /tmp/body 2>/dev/null && echo "yes db_down" || echo "yes -"
          }

          if [ -n "${{ inputs.debug_paths }}" ]; then
            echo "--- diagnostics matrix (no alert) ---"
            for p in $(echo "${{ inputs.debug_paths }}" | tr ',' ' '); do
              for host in https://hostamar.com https://hostamar-pages.romelraisul.workers.dev; do
                read -r c ch <<<"$(fetch "$host$p" "$UA")"
                printf '%-58s %s challenge=%s\n' "$host$p" "$c" "$ch"
              done
            done
            echo "verdict=UP:diagnostics" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verdict=""; edge="direct"
          for attempt in 1 2 3; do
            read -r code chal <<<"$(fetch "$URL" "$UA")"
            echo "public attempt $attempt -> HTTP $code challenge=$chal :: $(head -c 200 /tmp/body | tr -d '\n')"
            if [ "$code" = "200" ]; then
              read -r ok dbdown <<<"$(healthy)"
              if [ "$ok" = "yes" ]; then
                if [ "$dbdown" = "db_down" ]; then verdict="DOWN:db_disconnected"; else verdict="UP"; fi
              else
                verdict="DOWN:http_200_bad_payload"
              fi
              break
            fi
            if [ "$chal" = "yes" ]; then
              # Cloudflare is challenging this runner's IP -> the edge is up; ask the
              # Worker directly (not behind the zone's bot rules) for the real health.
              edge="challenged"
              read -r fc fchal <<<"$(fetch "$FALLBACK_URL" "$UA")"
              echo "fallback (workers.dev) -> HTTP $fc challenge=$fchal :: $(head -c 200 /tmp/body | tr -d '\n')"
              if [ "$fc" = "200" ]; then
                read -r ok dbdown <<<"$(healthy)"
                if [ "$ok" = "yes" ]; then
                  if [ "$dbdown" = "db_down" ]; then verdict="DOWN:db_disconnected"; else verdict="UP:edge_challenged"; fi
                else
                  verdict="DOWN:fallback_bad_payload"
                fi
              else
                verdict="DOWN:edge_challenged_and_fallback_http_$fc"
              fi
              break
            fi
            if [ "$code" = "000" ] || [ "$code" -ge 500 ] 2>/dev/null; then
              sleep 15   # transient edge hiccup: retry before paging anyone
              continue
            fi
            verdict="DOWN:http_$code"
            break
          done
          [ -n "$verdict" ] || verdict="DOWN:unreachable"
          if [ "${{ inputs.test_alert }}" = "true" ]; then verdict="DOWN:forced_test"; fi

          echo "verdict=$verdict edge=$edge"
          {
            echo "verdict=$verdict"
            echo "edge=$edge"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Off-box probe — hostamar.com"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| verdict | \`$verdict\` |"
            echo "| edge path | $edge |"
            echo "| endpoint | $URL |"
            echo "| at | $(date -u +%FT%TZ) (UTC) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert — Slack
        if: steps.probe.outputs.verdict != 'UP' && steps.probe.outputs.verdict != 'UP:edge_challenged' && steps.probe.outputs.verdict != 'UP:diagnostics'
        continue-on-error: true
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "no SLACK_WEBHOOK_URL secret set — skipping Slack alert"
            exit 0
          fi
          V="${{ steps.probe.outputs.verdict }}"
          PREFIX=""
          [ "$V" = "DOWN:forced_test" ] && PREFIX="[TEST] "
          curl -sS -o /tmp/slack.out -w 'slack_http=%{http_code}\n' -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"${PREFIX}\ud83d\udd34 hostamar.com DOWN (${V}) — off-box probe (edge=${{ steps.probe.outputs.edge }}) on ${URL} at $(date -u +%FT%TZ)\"}" \
            "$SLACK_WEBHOOK_URL" || true
          cat /tmp/slack.out 2>/dev/null || true

      - name: Fail the run when DOWN
        if: steps.probe.outputs.verdict != 'UP' && steps.probe.outputs.verdict != 'UP:edge_challenged' && steps.probe.outputs.verdict != 'UP:diagnostics'
        run: |
          echo "verdict=${{ steps.probe.outputs.verdict }} (edge=${{ steps.probe.outputs.edge }}) — failing the run so the Actions tab and the repo-owner notification both show it"
          exit 1
