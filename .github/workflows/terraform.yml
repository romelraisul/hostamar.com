# PIN3 approval gate for the Terraform plan->OPA->Infracost pipeline.
#
# There is no Terraform in this repo (hostamar-infra is a docker-compose host, and no
# terraform.yml exists anywhere) -> the trigger is manual so this can never be a dead CI
# gate. Copy the "decision gate" step into the real infra repo's terraform.yml, right
# after the OPA + Infracost steps. The logic lives in ops/decision-gate.sh and is tested
# by `ops/decision-gate.sh --selftest`.
name: terraform-decision-gate

on:
  workflow_dispatch:
    inputs:
      pr_title: { description: "PR title / module", required: false, default: "module/unknown" }

jobs:
  decision-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # --- replace with the real plan step in the infra repo: terraform show -json tfplan > tfplan.json
      - name: Placeholder plan
        run: echo '{"resource_changes":[]}' > tfplan.json

      - name: Decision API gate (PIN3)
        id: gate
        run: |
          set +e
          bash ops/decision-gate.sh tfplan.json "${{ inputs.pr_title }}" | tee gate.txt
          echo "exit=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Telegram — Prod Approval Required
        if: always()
        run: |
          grep -q 'Prod Approval Required' gate.txt || exit 0
          curl -sS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Prod Approval Required — ${{ inputs.pr_title }}%0A$(cat gate.txt | tail -2)" >/dev/null
          echo "notified"

      - name: Fail if approval required
        run: grep -q 'Prod Approval Required' gate.txt && exit 1 || exit 0
