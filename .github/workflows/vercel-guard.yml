name: vercel-guard
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC = 11:00 Dhaka, daily
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vercel-guard.mjs