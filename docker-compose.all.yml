# docker-compose.all.yml — V28 6-product local stack (Hostamar monorepo)
#
# এক লগইনে ভিডিও, হোস্টিং, চ্যাট, ব্রাউজার, IDE ও গেমিং
# Single auth: hostamar-app's lib/auth.ts JWT (HttpOnly cookie) — every service
# below is reached THROUGH the app's APIs (app/api/*), never directly exposed.
# Billing: bKash 01822417463 via the app's /api/payment/* — one verify path.
#
# MERGE-SAFE: NEW file; docker-compose.yml/.prod/.vps are untouched.
# OSS tools are IMAGES + profiles (no repo vendoring — clone-15-repos rejected).
# Zero-cost rule: nothing here is required for prod (hostamar.com runs on
# Vercel + CF + B2 + Neon); this is the BDIX/self-host expansion path.
#
# Usage:
#   docker compose -f docker-compose.all.yml up -d                        # core
#   docker compose -f docker-compose.all.yml --profile hosting up -d     # + PaaS
#   docker compose -f docker-compose.all.yml --profile chat --profile browser --profile ide --profile gaming up -d

services:
  # ── Core: the ONLY public entry. Proxies/authorizes all 6 products. ──
  hostamar-app:
    build: .
    ports: ["3005:3000"]
    env_file: .env.local
    environment:
      - NEXT_PUBLIC_BUILD_TARGET=api   # serve /api/* locally (no proxy loop)
    depends_on: [postgres, redis]
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      - POSTGRES_DB=hostamar
      - POSTGRES_PASSWORD=hostamar-local
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

  # ── Hosting profile: PaaS + billing ──
  coolify:
    image: coollabsio/coolify:latest
    profiles: ["hosting"]
    ports: ["3000:3000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coolify:/data
    restart: unless-stopped

  paymenter:
    image: paymenter/paymenter:latest
    profiles: ["hosting"]
    ports: ["8000:8000"]
    depends_on: [postgres]
    env_file: .env.local
    restart: unless-stopped

  # ── Chat profile: ChatGPT-style UI + live support + local models ──
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["chat"]
    ports: ["8080:8080"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false               # auth handled by hostamar-app proxy
    volumes: ["open-webui:/app/backend/data"]
    depends_on: [ollama]
    restart: unless-stopped

  chatwoot:
    image: chatwoot/chatwoot:latest
    profiles: ["chat"]
    ports: ["3002:3000"]
    depends_on: [postgres, redis]
    env_file: .env.local
    volumes: ["chatwoot-data:/app/storage"]
    restart: unless-stopped

  # ── Browser profile: anti-detect browsing (docker/camofox shim) ──
  camofox-browser:
    build: ./docker/camofox
    profiles: ["browser"]
    ports: ["3003:3000"]
    environment:
      - CAMOUFOX_HEADLESS=true
      - BROWSER_LLM_BASE_URL=${BROWSER_LLM_BASE_URL:-}
      - BROWSER_LLM_API_KEY=${BROWSER_LLM_API_KEY:-}
      - BROWSER_LLM_MODEL=${BROWSER_LLM_MODEL:-hostamar-1m-a}
    restart: unless-stopped

  # ── IDE profile: VS Code in the browser ──
  code-server:
    image: codercom/code-server:latest
    profiles: ["ide"]
    ports: ["8443:8080"]
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-hostamar-change-me}
    volumes: ["coder:/home/coder"]
    restart: unless-stopped

  # ── Gaming profile: GameStream host + game-server panel ──
  sunshine:
    image: lizardbyte/sunshine:latest
    profiles: ["gaming"]
    ports:
      - "47989:47989/tcp"
      - "47984:47984/tcp"
      - "47998-48000:47998-48000/udp"
    volumes: ["sunshine:/config"]
    privileged: true   # GPU/display access on the host VPS
    restart: unless-stopped

  pterodactyl-panel:
    image: ghcr.io/pterodactyl/panel:latest
    profiles: ["gaming"]
    ports: ["8030:80"]
    depends_on: [mysql]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["gaming"]
    ports: ["3306:3306"]
    environment:
      - MYSQL_ROOT_PASSWORD=hostamar-local
      - MYSQL_DATABASE=pterodactyl
    volumes: ["mysql:/var/lib/mysql"]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  open-webui:
  chatwoot-data:
  coolify:
  coder:
  sunshine:
  mysql:
