name = "hostamar-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[queues.producers]]
queue = "hostamar-jobs"
binding = "JOBS_QUEUE"

[[queues.consumers]]
queue = "hostamar-jobs"

[[d1_databases]]
binding = "DB"
database_name = "hostamar-orchestrator-db"
database_id = "REPLACE_WITH_DB_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["*/5 * * * *"]
