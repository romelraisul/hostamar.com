name = "hostamar-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[queues.producers]]
queue = "hostamar-jobs"
binding = "JOBS_QUEUE"

[[d1_databases]]
binding = "DB"
database_name = "hostamar-orchestrator-db"
database_id = "031ab7f9-f12e-4a9d-9649-c446782ba50b"

[[kv_namespaces]]
binding = "KV"
id = "969a3382b3724bb0a3bcd5111c4e1dbc"

[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPO = "romelraisul/hostamar.com"
