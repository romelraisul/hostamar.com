# Cloudflare Pages deployment for Next.js via OpenNext
# This deploys the OpenNext build output to Cloudflare Pages
name = "hostamar-pages"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Worker script from OpenNext build
main = ".open-next/worker.js"

# Static assets from OpenNext build
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# KV namespaces for catalog caching
[[kv_namespaces]]
binding = "HOSTAMAR_CATALOG"
id = "7ce14c69f70d48449dd50edd4be3dca3"

# B2 cache configuration
[vars]
B2_S3_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_S3_REGION = "us-east-005"
B2_CACHE_BUCKET = "hostamar-prod"
