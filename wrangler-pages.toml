# hostamar-pages worker (OpenNext on Cloudflare Workers).
# TOML keys after a table header belong to that table: workers_dev/account_id/
# routes placed after [[rules]] parse as rules[0] members, so wrangler deploy
# fails with "Failed to automatically retrieve account IDs" and a stale worker
# keeps serving (shipped that way in 98b986b9). Top-level keys stay at the top.
name = "hostamar-pages"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "e00717304c1139751214b8cda5078a8d"

# 2026-10-19: put CF edge cache in front of the worker for eyeball requests
# (route-attached workers can't use the Cache API — silently no-ops — so this
# per-worker fetch-cache is the only machine-doable edge-HIT path; docs:
# developers.cloudflare.com/workers/cache/configuration).
[cache]
enabled = true

# Apex CNAME stays pointed at Vercel as an untouched fallback.
# Rollback = uncomment the routes and redeploy.
# ROUTES DISABLED 2026-10-19: hostamar.com 503 ~100% of probes since ~21:00
# (CF error 1102 "Worker exceeded resource limits", free 10ms CPU cap).
# Traffic now falls through to Vercel origin (hostamar-build.vercel.app 200).
# 2026-10-19: hostamar.com AND www.hostamar.com attached as Worker CUSTOM
# DOMAINS via the dash (ids c666cd44…/…, certs d988737c…/bd22d530…, service
# hostamar-pages / production, both enabled). Cert SAN covers
# hostamar.com, www.hostamar.com, *.www.hostamar.com (Google Trust WE1,
# valid to 2027-01-17) — no 526. The Vercel-managed CNAMEs for both hostnames
# (cname.vercel-dns.com, ⚠ externally-managed) had to be deleted first — the
# attach refuses while they exist ("already has externally managed DNS
# records"), and the resolver's cached answer bridges the delete→attach gap.
# Zone-level routes hostamar.com/* and www.hostamar.com/* (set in the dash,
# NOT here) are deliberately RETAINED as the fallback path; custom domains take
# precedence while the routes keep serving if one ever detaches. Cache API is
# only functional on custom domains — before this attach the adapter's colo
# front silently no-opped.
# Rollback = remove the custom domains in the dash; routes keep the site up.
routes = [
  # { pattern = "hostamar.com/*", zone_name = "hostamar.com" },
  # { pattern = "www.hostamar.com/*", zone_name = "hostamar.com" }
]

# KV: read-mostly catalogs. Same account namespace the ai-gateway worker already
# populates (MODEL_CATALOG, binance_rate). FREE_MODELS is written hourly from WSL
# (scripts/kv-seed-free-models.ts) so /api/v1/free-models + /api/v1/models do a
# <1ms KV read instead of re-running a 26-363ms upstream merge per cache miss,
# which exceeded the CPU budget and 1102'd the whole site (Ray a47d58db1eb8db4f).
[[kv_namespaces]]
binding = "HOSTAMAR_CATALOG"
id = "7ce14c69f70d48449dd50edd4be3dca3"

# OpenNext incremental cache moved to Backblaze B2 (S3 API, key-restricted to
# hostamar-prod, s3.us-east-005) — no daily write quota, unlike KV (error 10048).
# NEXT_INC_CACHE_KV namespace 6e3e5048… left unbound; delete the namespace later
# if nothing else adopts it.
# ponytail: Prisma's workerd loader does `await import('./query_engine_bg.wasm')`
# during a request; workerd does not count that pending module load as I/O, so the
# first prisma request on a fresh isolate is killed as "hung" (~27% of requests).
# Compiling wasm imports as modules makes the load resolvable/embedded.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"

[build]
command = "npm run worker:build"
external = ["node:sqlite", "@libsql/isomorphic-ws"]

[vars]
# B2 S3-compatible incremental cache target (creds stay in worker secrets:
# B2_ACCOUNT_ID / B2_APPLICATION_KEY). Endpoint+bucket are the key's actual
# grants — verified against b2_authorize_account (us-east-005, hostamar-prod).
B2_S3_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_S3_REGION = "us-east-005"
B2_CACHE_BUCKET = "hostamar-prod"
# Box liveness for /api/health ( field): the box reports to Turso every few minutes
# (fleet/loop.mjs -> FleetReport); pc.alive = newest report younger than this many seconds.
HOSTAMAR_PC_MAX_AGE_S = "1200"
TURSO_DATABASE_URL = "libsql://hostamar-db-romelraisul.aws-us-east-1.turso.io"
TURSO_AUTH_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhIjoiNzMzZjJjYjgtNzAwZS00OTVhLTg4ZjctZDU0YzM1MzI5YWJlIiwiaWF0IjoxNzg5MTUwNjQwLCJleHAiOjE4MjA2ODY2NDB9.vYhXx7QZ4qJ5q5q5q5q5q5q5q5q5q5q5q5q5q5q5q5q"
B2_BUCKET_NAME = "hostamar-videos"
B2_ENDPOINT = "https://f002.backblazeb2.com"
NEXTAUTH_URL = "https://hostamar.com"
NEXT_PUBLIC_SITE_URL = "https://hostamar.com"
TV_HLS_URL = "https://tv.hostamar.com/hls/live/tv/index.m3u8"
# Paid embedding models 402 on this $0 OpenRouter account; the route retries
# once on this free model instead of failing the caller.
OPENROUTER_EMBED_FALLBACK = "nvidia/llama-nemotron-embed-vl-1b-v2:free"
# Local-first embedding router (Ollama, 4 models, auto-routed) behind the
# hostamar-local tunnel. Fallback above only runs when the PC is off.
EMBEDDINGS_URL = "https://embeddings.hostamar.com/v1/embeddings"
# Jev decision API on the home box (:8083) behind the hostamar-local tunnel.
# /api/v1/decisions degrades to each PIN's safe default when this is unreachable.
DECISIONS_URL = "https://decisions.hostamar.com"   # middleware client (appends /v1/decisions)
DECISION_API_URL = "https://decisions.hostamar.com"  # /api/decision route (same box, :8083)

[observability.logs]
enabled = true




