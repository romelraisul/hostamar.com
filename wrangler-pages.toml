name = "hostamar-pages"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Ponytail: apex CNAME stays pointed at Vercel as an untouched fallback; these
# routes intercept hostamar.com traffic before the origin is reached.
# Rollback = remove the routes and redeploy.
routes = [
  { pattern = "hostamar.com/*", zone_name = "hostamar.com" },
  { pattern = "www.hostamar.com/*", zone_name = "hostamar.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
TURSO_DATABASE_URL = "libsql://hostamar-db-romelraisul.aws-us-east-1.turso.io"
B2_BUCKET_NAME = "hostamar-videos"
B2_ENDPOINT = "https://f002.backblazeb2.com"
NEXTAUTH_URL = "https://hostamar.com"

[observability.logs]
enabled = true
