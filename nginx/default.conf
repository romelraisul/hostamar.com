upstream hostamar_app {
    server hostamar-app:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=llm:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # Health check endpoint for nginx itself
    location /__nginx_health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static assets — aggressive cache (immutable from Next.js)
    location /_next/static/ {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_valid 200 31536000s;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public static files
    location /static/ {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Auth routes — strict rate limiting
    location ~ ^/api/auth {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=auth burst=5 nodelay;
    }

    # API routes
    location /api/ {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api burst=30 nodelay;
        # Long timeout for AI model calls
        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # PRODUCTION LLM endpoint -> DMR bridge on :12434 (Docker DMR if up,
    # else native WSL Ollama via dmr-fallback.sh bridge). Same models
    # served either way: gemma4:E2B, docker.io/ai/gemma4:E2B, qwen3.6:latest.
    # Auth: Bearer sk-hostamar-router (same key as litellm master_key).
    # nginx container uses host.docker.internal to reach the host's loopback
    # where the DMR bridge listens. If the WSL IP changes, this breaks for
    # containers only — public clients still hit nginx fine, just no LLM.
    location /api/llm/ {
        proxy_pass http://host.docker.internal:12434/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer $http_authorization";
        # Long timeout for tool-augmented agent runs
        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
        limit_req zone=llm burst=20 nodelay;
    }

    # Everything else
    location / {
        proxy_pass http://hostamar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Connection "";
    }
}